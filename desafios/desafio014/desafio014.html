<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        table {
            border-collapse: collapse;
        }
        tr, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            border: 1px solid black;
            padding: 10px;
            width: 50px;
            height: 30px;
        }
        th.media {
            text-align: left; 
            background-color: gray;
            color: white;
        }
        td.nota {
            background-color: gray;
            color: white;
        }
        th.titulos {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="titulos" rowspan="2">Área</th>
                <th  class="titulos" rowspan="2">Disciplinas</th>
                <th colspan="2"  class="titulos">Notas</th>
                <th  class="titulos" rowspan="2">Média</th>
            </tr>
             <tr>
                <th class="titulos">Nota 1</th>
                <th class="titulos">Nota 2</th>
            </tr>
        </thead>
    
        <tbody>
            <tr>
                <th rowspan="3">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="media">Média de Exatas</th>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geográfia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="media"> Média de Humanas</th>
                <td class="nota">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
