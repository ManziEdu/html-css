<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas/Numero</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table td{
            width: 40px;
        }
        td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }
        td.purple {
            background-color: rgba(0, 0, 255, 0.425);
        }
        td.blue {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="blue">1</td>
            <td class="blue">2</td>
            <td rowspan="2" class="purple">3</td>
            <td class="blue">4</td>
        </tr>
        <tr>
            <td class="blue">5</td>
            <td class="blue">6</td>
            <td class="blue">7</td>
        </tr>
        <tr>
            <td colspan="3" class="purple">8</td>
            <td class="blue">9</td>
        </tr>
        <tr>
            <td rowspan="2" class="purple">10</td>
            <td colspan="2" class="purple">11</td>
            <td class="blue">12</td>
        </tr>
        <tr>
            <td class="blue">13</td>
            <td class="blue">14</td>
            <td class="blue">15</td>
        </tr>
    </table>
</body>
</html>
