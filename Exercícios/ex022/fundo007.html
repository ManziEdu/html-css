<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container{
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: relative;
            height: 96vh;
            padding: 10px;
            background-color: purple;
        }
        #conteudo0 {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: greenyellow;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
            
        }
        #conteudo1 {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: yellow;

            left: 50%;
            top: 12%;

            transform: translate(-50%, 25%);
            
        }
         #conteudo2 {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: yellow;

            left: 50%;
            top: 56%;

            transform: translate(-50%, 25%);
            
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo0"></article>
        <article id="conteudo1"></article>
        <article id="conteudo2"></article>
    </section>
</body>
</html>
